[project]
stage_name = "stage_03"
experiment_name = "ifan_stage3"

[runtime]
seed = 42
device = "cuda"
output_suffix = "long80_c32_same_width_paper_original"

[paths]
output_root = "IFAN_Edge/outputs/stage3"
librispeech_root = "datasets/LibriSpeech"
train_split = "train-clean-100"
test_split = "test-clean"
baseline_checkpoint_path = "models/1sourceTracking_icoCNN_robot_K4096_r2_model.bin"

[data]
trajectory_seconds = 20
fs = 16000
k = 4096
step = 3072
nb_points = 156
apply_vad = true
lms_order = 64
lms_step_size = 0.01
lms_map_normalize = true
lms_map_mode = "tau_sample"
lms_peak_sigma = 2.0
lms_update_mode = "trajectory_tracking"
lms_normalized = false
lms_include_self_pairs = true
lms_backend = "frequency_block"
lms_block_size = 256

[model]
r = 2
branch_channels = 32
pre_fusion_pooling = true
final_head_pooling = false
smooth_vertices = true

[training]
epochs = 80
phase1_epochs = 20
batch_size_phase1 = 1
batch_size_phase2 = 10
micro_batch_size_phase1 = 1
micro_batch_size_phase2 = 1
lr_phase1 = 1e-4
lr_phase2 = 1e-5
train_t60_min = 0.2
train_t60_max = 1.3
train_snr_min_phase1 = 30.0
train_snr_max_phase1 = 30.0
train_snr_min_phase2 = 5.0
train_snr_max_phase2 = 30.0

[evaluation]
validation_dataset_size = 32
validation_batch_size = 1
validation_snr_min = 5.0
validation_snr_max = 30.0
scenario_eval_size = 8
scenario_eval_batch_size = 1

[checkpoints]
every_n_epochs = 10

[contract]
experiment_role = "c32_same_width_architecture_ablation"
srp_variant = "paper_original"
temporal_conv_variant = "standard_1d"
temporal_module = "conv"
primary_benchmark_suite = "simulated_4scene+hard_scenes+locata_eval_benchmark2_task1_3_5"
mainline_anchor_run = "IFAN_Edge/outputs/stage3/ifan_stage3_long80_freqblock_paper_original_20260426_155330"
mainline_anchor_locata_report = "IFAN_Edge/outputs/stage3/analysis/locata_eval_benchmark2_ifan80_best.json"

[gates]
lightweight_ready_delta_deg = 0.3

[notes]
summary = "Long-budget IFAN C=32 same-width ablation against the icoCNN C=32 baseline: keep PHAT+LMS, shared attention, pre-fusion PoolIco, and the locked paper_original training protocol. This is a same-channel-width upper-bound check, not parameter-matched."
