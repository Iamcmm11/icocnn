<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">IFAN Edge Current Partitioned System Macro Block Diagram</title>
  <desc id="desc">Macro block diagram for the current IFAN Edge implementation, showing PS/PL partitioning, the active dual-feature frontend, the reused layer2-5 ConvIco kernel for the R1 fusion/final head, and the optional FeatureMABA and post-MABA stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f1e8"/>
      <stop offset="100%" stop-color="#ece7dc"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#133c55"/>
      <stop offset="100%" stop-color="#0f2f44"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#355070"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#243b53" flood-opacity="0.15"/>
    </filter>
    <style>
      .title-main { font: 700 34px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #ffffff; }
      .title-sub { font: 400 16px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #dbe7ef; }
      .lane-title { font: 700 21px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #143642; }
      .box-title { font: 700 21px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #143642; }
      .box-sub { font: 400 15px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #355070; }
      .shape-text { font: 600 17px 'Consolas', 'Segoe UI', monospace; fill: #143642; }
      .note { font: 400 14px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #526d82; }
      .badge { font: 700 13px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #ffffff; letter-spacing: 0.08em; }
      .legend-text { font: 400 15px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #334e68; }
      .callout { font: 600 14px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #8b1e3f; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1120" fill="url(#bg)"/>
  <rect x="40" y="30" width="1720" height="92" rx="24" fill="url(#titleBar)"/>
  <text x="78" y="77" class="title-main">IFAN Edge Current Partitioned System</text>
  <text x="78" y="104" class="title-sub">PS/PL co-design macro block diagram based on the current verified implementation path</text>

  <rect x="70" y="145" width="1660" height="72" rx="18" fill="#f9d9d2" stroke="#b42318" stroke-width="2"/>
  <text x="100" y="187" class="callout">Current system strategy: partitioned verification + reusable kernels. It is not a single monolithic full-stage IP.</text>
  <text x="100" y="207" class="note">Solid blocks = active or validated modules. Dashed blocks = optional / next-stage candidates. Orange blocks = PS glue, scheduling, or boundary handling.</text>

  <rect x="70" y="255" width="1660" height="265" rx="26" fill="#f8fafc" stroke="#bed3df" stroke-width="2"/>
  <rect x="70" y="548" width="1660" height="340" rx="26" fill="#f9fcfd" stroke="#bed3df" stroke-width="2"/>

  <text x="96" y="295" class="lane-title">PS / Host / Software Orchestration</text>
  <text x="96" y="588" class="lane-title">PL / FPGA Reusable Compute Path</text>

  <rect x="110" y="332" width="220" height="120" rx="24" fill="#ffffff" stroke="#91a7b4" stroke-width="2" filter="url(#softShadow)"/>
  <text x="220" y="376" text-anchor="middle" class="box-title">Acoustic Scene</text>
  <text x="220" y="404" text-anchor="middle" class="box-sub">mic array / raw audio</text>
  <text x="220" y="428" text-anchor="middle" class="note">outside current HLS scope</text>

  <rect x="370" y="312" width="295" height="160" rx="24" fill="#ffe8cc" stroke="#d08700" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="518" y="355" text-anchor="middle" class="box-title">Feature Generation</text>
  <text x="518" y="382" text-anchor="middle" class="box-sub">PHAT + LMS maps</text>
  <text x="518" y="410" text-anchor="middle" class="shape-text">dual_maps [2, T, 5, 4, 8]</text>
  <text x="518" y="437" text-anchor="middle" class="note">current Edge flow provides precomputed features to HLS</text>
  <rect x="479" y="447" width="78" height="23" rx="11" fill="#d08700"/>
  <text x="518" y="463" text-anchor="middle" class="badge">PS ACTIVE</text>

  <rect x="710" y="312" width="310" height="160" rx="24" fill="#ffe8cc" stroke="#d08700" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="865" y="355" text-anchor="middle" class="box-title">Scheduler + Buffer Manager</text>
  <text x="865" y="382" text-anchor="middle" class="box-sub">DMA / frame window / tensor handoff</text>
  <text x="865" y="410" text-anchor="middle" class="note">keeps active HLS tops decoupled instead of building one static full-stage top</text>
  <text x="865" y="434" text-anchor="middle" class="note">controls data movement between frontend, pooling glue, ConvIco kernel, and later modules</text>
  <rect x="826" y="447" width="78" height="23" rx="11" fill="#d08700"/>
  <text x="865" y="463" text-anchor="middle" class="badge">PS ACTIVE</text>

  <rect x="1080" y="312" width="290" height="160" rx="24" fill="#ffe8cc" stroke="#d08700" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="1225" y="355" text-anchor="middle" class="box-title">R2 -&gt; R1 Glue Stage</text>
  <text x="1225" y="382" text-anchor="middle" class="box-sub">PoolIco + boundary buffers</text>
  <text x="1225" y="410" text-anchor="middle" class="shape-text">[T, 8, 6, 5, 4, 8] -&gt; [T, 8, 6, 5, 2, 4]</text>
  <text x="1225" y="437" text-anchor="middle" class="note">currently the interface gap between the frontend slice and the R1 fusion / final head</text>
  <rect x="1186" y="447" width="78" height="23" rx="11" fill="#d08700"/>
  <text x="1225" y="463" text-anchor="middle" class="badge">PS GLUE</text>

  <rect x="1425" y="332" width="245" height="120" rx="24" fill="#ffffff" stroke="#91a7b4" stroke-width="2" filter="url(#softShadow)"/>
  <text x="1548" y="375" text-anchor="middle" class="box-title">System Boundary</text>
  <text x="1548" y="404" text-anchor="middle" class="box-sub">pre-readout tensor routing</text>
  <text x="1548" y="428" text-anchor="middle" class="note">decides whether next stage stays in PS or moves into PL</text>

  <path d="M330 392 L370 392" stroke="#355070" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M665 392 L710 392" stroke="#355070" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1020 392 L1080 392" stroke="#355070" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1370 392 L1425 392" stroke="#355070" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="110" y="640" width="360" height="190" rx="28" fill="#dff3ee" stroke="#1d7874" stroke-width="3" filter="url(#softShadow)"/>
  <text x="290" y="690" text-anchor="middle" class="box-title">Dual-Feature Frontend</text>
  <text x="290" y="717" text-anchor="middle" class="box-sub">active HLS top: ifan_dual_frontend_top</text>
  <text x="290" y="746" text-anchor="middle" class="note">PHAT branch + LMS branch</text>
  <text x="290" y="770" text-anchor="middle" class="note">shared attention + branch-local fusion + PHAT/LMS add</text>
  <text x="290" y="802" text-anchor="middle" class="shape-text">output: fused R2 feature [T, 8, 6, 5, 4, 8]</text>
  <rect x="224" y="812" width="132" height="24" rx="12" fill="#1d7874"/>
  <text x="290" y="829" text-anchor="middle" class="badge">ACTIVE HLS TOP</text>

  <rect x="535" y="618" width="530" height="232" rx="28" fill="#fff7e6" stroke="#c27b00" stroke-width="2.5" stroke-dasharray="10 10" filter="url(#softShadow)"/>
  <text x="800" y="664" text-anchor="middle" class="box-title">R1 Fusion / Final Head (5 stages)</text>
  <text x="800" y="691" text-anchor="middle" class="box-sub">current mixed execution path around the reused ConvIco kernel</text>

  <rect x="568" y="716" width="230" height="102" rx="20" fill="#dff3ee" stroke="#1d7874" stroke-width="3"/>
  <text x="683" y="754" text-anchor="middle" class="box-title">Reused ConvIco Kernel</text>
  <text x="683" y="780" text-anchor="middle" class="box-sub">from layer2-5, parameterized to C8 / T6</text>
  <text x="683" y="804" text-anchor="middle" class="note">validated on fusion0..fusion3 + final</text>

  <rect x="826" y="716" width="206" height="102" rx="20" fill="#ffe8cc" stroke="#d08700" stroke-width="2.5"/>
  <text x="929" y="754" text-anchor="middle" class="box-title">Glue Between Blocks</text>
  <text x="929" y="780" text-anchor="middle" class="box-sub">ReLU + TemporalConv1d + LNorm</text>
  <text x="929" y="804" text-anchor="middle" class="note">not yet folded into the reused PL head kernel</text>

  <text x="800" y="836" text-anchor="middle" class="shape-text">input / output tensor: [T, 8, 6, 5, 2, 4]</text>
  <text x="800" y="860" text-anchor="middle" class="note">logical order: fusion0 -&gt; fusion1 -&gt; fusion2 -&gt; fusion3 -&gt; final</text>
  <rect x="744" y="603" width="112" height="24" rx="12" fill="#c27b00"/>
  <text x="800" y="620" text-anchor="middle" class="badge">MIXED PATH</text>

  <rect x="1120" y="640" width="290" height="190" rx="28" fill="#dff3ee" stroke="#1d7874" stroke-width="3" stroke-dasharray="12 10" filter="url(#softShadow)"/>
  <text x="1265" y="690" text-anchor="middle" class="box-title">FeatureMABA Candidate</text>
  <text x="1265" y="717" text-anchor="middle" class="box-sub">separate pre-readout temporal refiner</text>
  <text x="1265" y="746" text-anchor="middle" class="shape-text">input / output: [T, 8, 6, 5, 2, 4]</text>
  <text x="1265" y="774" text-anchor="middle" class="note">independent native / csim / synth line</text>
  <text x="1265" y="798" text-anchor="middle" class="note">planned as a later PL innovation module</text>
  <rect x="1212" y="812" width="106" height="24" rx="12" fill="#5aa9a6"/>
  <text x="1265" y="829" text-anchor="middle" class="badge">PL CANDIDATE</text>

  <rect x="1460" y="640" width="245" height="190" rx="28" fill="#edf2f7" stroke="#718096" stroke-width="2.5" stroke-dasharray="12 10" filter="url(#softShadow)"/>
  <text x="1582" y="690" text-anchor="middle" class="box-title">Post-MABA Head</text>
  <text x="1582" y="718" text-anchor="middle" class="box-sub">optional PL head or PS post-process</text>
  <text x="1582" y="751" text-anchor="middle" class="note">Channel Readout</text>
  <text x="1582" y="774" text-anchor="middle" class="note">Region Max</text>
  <text x="1582" y="797" text-anchor="middle" class="note">CleanVertices + SoftArgMax</text>
  <text x="1582" y="821" text-anchor="middle" class="shape-text">coords [T, 3]</text>

  <path d="M290 520 L290 640" stroke="#355070" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M470 735 L535 735" stroke="#355070" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1065 735 L1120 735" stroke="#355070" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1410 735 L1460 735" stroke="#355070" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="110" y="928" width="1595" height="138" rx="24" fill="#ffffff" stroke="#c7d2da" stroke-width="2"/>
  <text x="140" y="966" class="box-title">Reading Guide</text>
  <text x="140" y="994" class="legend-text">1. Current active frontend HLS boundary is the dual-feature frontend slice, not the old monolithic full Stage-1 top.</text>
  <text x="140" y="1018" class="legend-text">2. The Edge R1 head is currently validated by reusing the original layer2-5 ConvIco IP with C8/T6 parameterization, then aligning real fusion0..final tensors.</text>
  <text x="140" y="1042" class="legend-text">3. FeatureMABA and post-MABA stay independent until their own resource closure is clear; the present system is PS/PL collaborative rather than one all-in-PL implementation.</text>

  <rect x="1210" y="950" width="26" height="18" rx="5" fill="#dff3ee" stroke="#1d7874" stroke-width="2"/>
  <text x="1248" y="965" class="legend-text">solid green: active / validated PL block</text>
  <rect x="1210" y="988" width="26" height="18" rx="5" fill="#ffe8cc" stroke="#d08700" stroke-width="2"/>
  <text x="1248" y="1003" class="legend-text">orange: PS glue / schedule / tensor handoff</text>
  <rect x="1210" y="1026" width="26" height="18" rx="5" fill="#edf2f7" stroke="#718096" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1248" y="1041" class="legend-text">dashed: optional or next-stage candidate</text>
</svg>
